<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QvAuto - Official Sileo / Cydia Repo</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent: #007aff;
            --accent-glow: rgba(0, 122, 255, 0.35);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            box-shadow: 0 6px 20px var(--accent-glow);
            margin-bottom: 16px;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        p.subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-sileo {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-sileo:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-zebra {
            background: #21262d;
            color: #f0f6fc;
            border: 1px solid var(--border-color);
        }
        .btn-zebra:hover { background: #30363d; }
        .url-box {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            color: #58a6ff;
            margin-top: 16px;
            word-break: break-all;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="CydiaIcon.png" alt="QvAuto" class="icon">
        <h1>QvAuto Repo</h1>
        <p class="subtitle">Kho ứng dụng Tweak tự động hoá iOS & Quản lý Đa Tài Khoản</p>
        
        <a href="sileo://source/https://repo.yourdomain.com" class="btn btn-sileo">📲 Thêm vào Sileo</a>
        <a href="zbra://sources/add/https://repo.yourdomain.com" class="btn btn-zebra">🦓 Thêm vào Zebra</a>
        
        <div class="url-box">
            https://repo.yourdomain.com
        </div>
        
        <div class="footer">
            Hỗ trợ iOS 14.0 - 16.6.1 (Dopamine Rootless & Rootful)
        </div>
    </div>
</body>
</html>
